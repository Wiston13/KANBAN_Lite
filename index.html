<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANBAN Lite</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>

<body>
    <!-- 側邊攔 -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>KANBAN Lite</h2>
        </div>
        <hr>
        <ul class="sidebar-links">

            <li>
                <a href="#" class="sidebar-object" data-page-section="page-dashboard">
                    <span class="material-symbols-outlined">
                        dashboard
                    </span>
                    <span class="sidebar-label">總覽</span>
                </a>
            </li>
            <li>
                <a href="#" class="sidebar-object active" data-page-section="page-my-board">
                    <span class="material-symbols-outlined">
                        note_stack
                    </span>
                    <span class="sidebar-label">我的看板</span>
                </a>
            </li>
            <li>
                <a href="#" class="sidebar-object" data-page-section="page-settings">
                    <span class="material-symbols-outlined">
                        settings
                    </span>
                    <span class="sidebar-label">設定</span>
                </a>
            </li>
        </ul>

        <div class="user-account">
            <div class="user-profile">
                <img src="./img/avatar.png" alt="Profile Image">
                <div class="user-detail">
                    <h3>Admin</h3>
                </div>
            </div>
        </div>
    </aside>


    <!-- 主要內容 -->
    <main class="main-content">

        <!-- 總覽 -->
        <section class="page-section" id="page-dashboard">
            <h1>總覽</h1>
        </section>

        <!-- 我的看板 -->
        <section class="page-section active" id="page-my-board">
            <header class="board-header">
                <h1>我的看板</h1>
                <button id="add-task-btn" class="add-task-btn">
                    <span class="material-symbols-outlined">add</span>
                    <span>增加任務</span>
                </button>
            </header>
            <hr>
            <div class="my-board-main">
                <article class="task-column">
                    <h2>To Do</h2>
                    <div class="task-list" id="todo-list">


                    </div>
                </article>
                <article class="task-column">
                    <h2>In Progress</h2>
                    <div class="task-list" id="inprogress-list">


                    </div>
                </article>
                <article class="task-column">
                    <h2>Done</h2>
                    <div class="task-list" id="done-list">


                    </div>
                </article>
            </div>
        </section>

        <!-- 設定 -->
        <section class="page-section" id="page-settings">
            <h1>設定</h1>
        </section>


        <!-- 新增任務頁 -->
        <div class="task-modal" id="task-modal">
            <div class="task-modal-content">
                <header class="task-modal-header">
                    <h2></h2>
                </header>

                <form id="task-form" class="task-form">
                    <div class="form-field task-modal-title">
                        <label for="task-title-input">標題</label>
                        <input type="text" id="task-title-input" maxlength="30" placeholder="請輸入任務標題" required>
                    </div>

                    <div class="form-row">
                        <div class="form-field">
                            <label for="task-priority-input">優先度</label>
                            <select id="task-priority-input">
                                <option value="high">High</option>
                                <option value="medium">Medium</option>
                                <option value="low">Low</option>
                            </select>
                        </div>

                        <div class="form-field">
                            <label for="task-tag-input">標籤</label>
                            <input type="text" id="task-tag-input" maxlength="15" placeholder="general">
                        </div>

                        <div class="form-field">
                            <label for="task-status-input">狀態</label>
                            <select id="task-status-input">
                                <option value="todo">To Do</option>
                                <option value="inprogress">In Progress</option>
                                <option value="done">Done</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="task-description-input">描述</label>
                        <textarea id="task-description-input" maxlength="120" placeholder="請輸入任務描述" required></textarea>
                    </div>

                    <div class="modal-actions">
                        <button type="button" id="delete-task-btn">刪除任務</button>
                        <div class="modal-actions-main">
                            <button type="submit" id="save-task-btn">儲存</button>
                            <button type="button" id="close-modal-btn">取消</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div id="delete-task-popover" popover="manual">
            <h2>此操作無法復原，確認要刪除此任務嗎?</h2>
            <div class="popover-actions">
                <button type="button" id="popover-delete-task-btn">確定</button>
                <button type="button" id="close-popover-btn">取消</button>
            </div>
        </div>


    </main>


    <script>

        $(document).ready(() => {
            // 側邊欄切換頁面
            $(".sidebar-object").on("click", function (e) {
                // 阻止預設行為，不然點擊時瀏覽器可能會跳到頁面頂部，或讓網址多一個 #
                e.preventDefault();

                $(".sidebar-object").removeClass("active");
                $(".page-section").removeClass("active");

                $(this).addClass("active");

                let targetPageId = $(this).data("page-section");
                $("#" + targetPageId).addClass("active");
            })


        })


        let tasks = [
            {
                id: 1,
                title: "今天要帶狗狗去散步",
                content: "今天天氣真好，我要餵狗",
                priority: "high",
                tag: "good",
                status: "todo"
            },
            {
                id: 2,
                title: "明天要帶狗狗去散步",
                content: "明天天氣真好，狗要餵我",
                priority: "low",
                tag: "play",
                status: "done"
            },
            {
                id: 3,
                title: "後天狗狗要帶我去散步",
                content: "後天天氣真好，我要餵狗",
                priority: "medium",
                tag: "play",
                status: "inprogress"
            },
            {
                id: 4,
                title: "明天要帶狗狗去散步",
                content: "明天天氣真好，狗要餵我",
                priority: "low",
                tag: "play",
                status: "todo"
            }
        ];

        function saveTasksToLocalStorage(tasks) {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }
        function loadTasksFromLocalStorage() {
            return JSON.parse(localStorage.getItem("tasks"));
        }

        if (loadTasksFromLocalStorage() === null) {
            saveTasksToLocalStorage(tasks);
        }


        let editingTaskId = -1;
        function resetTaskForm() {
            editingTaskId = -1;
            $(".task-modal-header h2").text("新增任務");
            $("#delete-task-btn").hide();
            $("#task-title-input").val("");
            $("#task-description-input").val("");
            $("#task-tag-input").val("");
            $("#task-priority-input").val("medium");
            $("#task-status-input").val("todo");
        }

        function closeAndResetTaskModal() {
            resetTaskForm();
            $(".task-modal").removeClass("active");
        }

        $("#add-task-btn").on("click", () => {
            resetTaskForm();
            $(".task-modal").addClass("active");
        });

        $("#task-form").on("submit", function (e) {
            e.preventDefault();
            let tasks = loadTasksFromLocalStorage();
            let task = {
                "id": (editingTaskId < 0) ? new Date().getTime() : editingTaskId,
                "title": $("#task-title-input").val().trim(),
                "content": $("#task-description-input").val().trim(),
                "priority": $("#task-priority-input").val(),
                "tag": $("#task-tag-input").val().trim(),
                "status": $("#task-status-input").val()
            };
            if (task.tag === "") {
                task.tag = "general";
            }

            if (editingTaskId < 0) {
                tasks.push(task);
            } else {
                let tasksIndex = tasks.findIndex(item => item.id === editingTaskId);
                if (tasksIndex == -1) {
                    alert("發生錯誤，請重試一次!");
                    return;
                }
                tasks.splice(tasksIndex, 1, task);
            }
            saveTasksToLocalStorage(tasks);
            renderTasks();
            closeAndResetTaskModal();
        })

        $("#task-modal").on("click", function (e) {
            if (e.target === this) {
                closeAndResetTaskModal();
            }
        });

        $("#close-modal-btn").on("click", () => {
            closeAndResetTaskModal();
        })

        // 確定刪除popover控制
        const deletePopover = $("#delete-task-popover")[0];
        $("#delete-task-btn").on("click", () => {
            if (editingTaskId < 0) {
                return;
            }
            deletePopover.showPopover();
        })

        $("#popover-delete-task-btn").on("click", () => {
            if (editingTaskId < 0) {
                return;
            }
            let tasks = loadTasksFromLocalStorage();
            let tasksIndex = tasks.findIndex(item => item.id === editingTaskId);
            if (tasksIndex == -1) {
                alert("發生錯誤，請重試一次!");
                return;
            }
            tasks.splice(tasksIndex, 1);
            saveTasksToLocalStorage(tasks);
            renderTasks();

            deletePopover.hidePopover();
            closeAndResetTaskModal();
        })

        $("#close-popover-btn").on("click", () => {
            deletePopover.hidePopover();
        })

        $(document).on("click", ".task-card", function () {
            const taskId = Number($(this).data("id"));
            let tasks = loadTasksFromLocalStorage();
            const task = tasks.find(item => item.id === taskId);
            if (!task) {
                return;
            }
            editingTaskId = taskId;
            $("#task-title-input").val(task.title);
            $("#task-description-input").val(task.content);
            $("#task-tag-input").val(task.tag);
            $("#task-priority-input").val(task.priority);
            $("#task-status-input").val(task.status);

            $(".task-modal-header h2").text("編輯任務");
            $("#delete-task-btn").show();
            $(".task-modal").addClass("active");
        })

        function createTaskCard(task) {
            return `
                    <div class="task-card" data-id="${task.id}" draggable="true">
                        <div class="task-card-title">
                            ${task.title}
                        </div>
                        <div class="task-card-content">
                            ${task.content}
                        </div>
                        <div class="task-card-priority priority-${task.priority}">
                            ${task.priority}
                        </div>
                        <div class="task-card-tags">
                            <span class="task-card-tag">${task.tag}</span>
                        </div>
                    </div>
                `;
        }


        function renderTasks() {
            $(".task-list").empty();
            let tasks = loadTasksFromLocalStorage();
            $.each(tasks, function (index, element) {
                $("#" + element.status + "-list").append(createTaskCard(element));
            })
        }
        renderTasks();

        // Task Cards Drag & Drop
        $(document).on("dragstart", ".task-card", function (e) {

            const taskId = $(this).data("id");

            e.originalEvent.dataTransfer.setData("text/plain", taskId);
            $(this).addClass("dragging");
        });

        $(document).on("dragend", ".task-card", function () {
            $(this).removeClass("dragging");
            $(".task-list").removeClass("drag-over");
        });

        $(document).on("dragover", ".task-list", function (e) {
            e.preventDefault();

            $(".task-list").removeClass("drag-over");
            $(this).addClass("drag-over");
        });

        $(document).on("drop", ".task-list", function (e) {
            e.preventDefault();
            $(".task-list").removeClass("drag-over");

            const taskId = Number(e.originalEvent.dataTransfer.getData("text/plain"));
            const targetStatus = this.id.replace("-list", "");
            let tasks = loadTasksFromLocalStorage();
            const task = tasks.find(function (task) {
                return task.id === taskId;
            });

            if (!task) {
                return;
            }

            task.status = targetStatus;
            saveTasksToLocalStorage(tasks);
            renderTasks();
        });


















    </script>

</body>

</html>
