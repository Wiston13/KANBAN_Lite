<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANBAN Lite</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>

</head>

<body>
    <!-- 側邊攔 -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>KANBAN Lite</h2>
        </div>
        <hr>
        <ul class="sidebar-links">

            <li>
                <a href="#" class="sidebar-object" data-page-section="page-dashboard">
                    <span class="material-symbols-outlined">
                        dashboard
                    </span>
                    <span class="sidebar-label">總覽</span>
                </a>
            </li>
            <li>
                <a href="#" class="sidebar-object active" data-page-section="page-my-board">
                    <span class="material-symbols-outlined">
                        note_stack
                    </span>
                    <span class="sidebar-label">我的看板</span>
                </a>
            </li>
            <li>
                <a href="#" class="sidebar-object" data-page-section="page-settings">
                    <span class="material-symbols-outlined">
                        settings
                    </span>
                    <span class="sidebar-label">設定</span>
                </a>
            </li>
        </ul>

        <div class="user-account">
            <div class="user-profile">
                <img src="./img/avatar.png" alt="Profile Image">
                <div class="user-detail">
                    <h3>Admin</h3>
                </div>
            </div>
        </div>
    </aside>

    <main class="main-content">

        <section class="page-section" id="page-dashboard">
            <h1>總覽</h1>
        </section>

        <section class="page-section active" id="page-my-board">
            <header class="board-header">
                <h1>我的看板</h1>
                <button id="add-task-btn" class="add-task-btn">
                    <span class="material-symbols-outlined">add</span>
                    <span>增加任務</span>
                </button>
            </header>
            <hr>
            <div class="my-board-main">
                <article class="task-column">
                    <h2>To Do</h2>
                    <div class="task-list" id="todo-list">


                    </div>
                </article>
                <article class="task-column">
                    <h2>In Progress</h2>
                    <div class="task-list" id="inprogress-list">


                    </div>
                </article>
                <article class="task-column">
                    <h2>Done</h2>
                    <div class="task-list" id="done-list">


                    </div>
                </article>
            </div>
        </section>

        <section class="page-section" id="page-settings">
            <h1>設定</h1>
        </section>


        <!-- 新增任務頁 -->
        <div class="task-modal" id="task-modal">
            <div class="task-modal-content">
                <header>
                    <h2 style="display: inline;">新增任務</h2>
                </header>
                <form id="task-form">
                    <div class="task-modal-title">
                        <input type="text" id="task-title-input" maxlength="30" placeholder="請輸入任務標題" required>
                    </div>
                    <div>
                        <label for="task-priority-input">優先度:</label>
                        <select id="task-priority-input">
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>

                        <label for="task-tag-input">標籤:</label>
                        <input type="text" id="task-tag-input" maxlength="15">

                        <label for="task-status-input">狀態:</label>
                        <select id="task-status-input">
                            <option value="todo">To Do</option>
                            <option value="inprogress">In Progress</option>
                            <option value="done">Done</option>
                        </select>
                    </div>
                    <div>
                        描述:
                        <br>
                        <textarea id="task-description-input" maxlength="120" placeholder="請輸入任務描述" required></textarea>
                    </div>

                    <div class="modal-actions">
                        <button type="submit" id="save-task-btn">儲存</button>
                        <button type="button" id="close-modal-btn">取消</button>
                    </div>
                </form>
            </div>
        </div>




    </main>


    <script>

        $(document).ready(() => {
            // 側邊欄切換頁面
            $(".sidebar-object").on("click", function (e) {
                // 阻止預設行為，不然點擊時瀏覽器可能會跳到頁面頂部，或讓網址多一個 #
                e.preventDefault();

                $(".sidebar-object").removeClass("active");
                $(".page-section").removeClass("active");

                $(this).addClass("active");

                let targetPageId = $(this).data("page-section");
                $("#" + targetPageId).addClass("active");
            })


        })

        //原生JS寫法
        // const sidebarLinks = document.querySelectorAll('.sidebar-object');
        // const pageSections = document.querySelectorAll('.page-section');

        // sidebarLinks.forEach(link => {
        //     link.addEventListener('click', (e) => {
        //         e.preventDefault();

        //         // Remove active class from all links and sections
        //         sidebarLinks.forEach(link => link.classList.remove('active'));
        //         pageSections.forEach(section => section.classList.remove('active'));

        //         // Add active class to the clicked link and corresponding section
        //         link.classList.add('active');
        //         const targetSection = document.querySelector(`#${link.dataset.pageSection}`);
        //         if (targetSection) {
        //             targetSection.classList.add('active');
        //         }
        //     });
        // });

        let tasks = [
            {
                id: 1,
                title: "今天要帶狗狗去散步",
                content: "今天天氣真好，我要餵狗",
                priority: "high",
                tag: "good",
                status: "todo"
            },
            {
                id: 2,
                title: "明天要帶狗狗去散步",
                content: "明天天氣真好，狗要餵我",
                priority: "low",
                tag: "play",
                status: "done"
            },
            {
                id: 3,
                title: "後天狗狗要帶我去散步",
                content: "後天天氣真好，我要餵狗",
                priority: "medium",
                tag: "play",
                status: "inprogress"
            },
            {
                id: 4,
                title: "明天要帶狗狗去散步",
                content: "明天天氣真好，狗要餵我",
                priority: "low",
                tag: "play",
                status: "todo"
            }
        ];


        $("#add-task-btn").on("click", function () {
            // $("#" + task.status + "-list").append(createTaskCard(task));
            $(".task-modal").addClass("active");
        });

        $("#close-modal-btn").on("click", function () {
            resetTaskForm();
            $(".task-modal").removeClass("active");
        })

        $("#task-modal").on("click", function (e) {
            if (e.target === this) {
                resetTaskForm();
                $("#task-modal").removeClass("active");
            }
        });

        function resetTaskForm() {
            $("#task-title-input").val("");
            $("#task-description-input").val("");
            $("#task-tag-input").val("");
            $("#task-priority-input").val("medium");
            $("#task-status-input").val("todo");
        }

        $("#task-form").on("submit", function (e) {
            e.preventDefault();
            let task = {
                "id": new Date().getTime(),
                "title": $("#task-title-input").val().trim(),
                "content": $("#task-description-input").val().trim(),
                "priority": $("#task-priority-input").val(),
                "tag": $("#task-tag-input").val().trim(),
                "status": $("#task-status-input").val()
            };

            if (task.tag === "") {
                task.tag = "general";
            }

            tasks.push(task);
            renderTasks();

            resetTaskForm();
            $(".task-modal").removeClass("active");
        })


        function createTaskCard(task) {
            return `
                    <div class="task-card" data-id="${task.id}">
                        <div class="task-card-title">
                            ${task.title}
                        </div>
                        <div class="task-card-content">
                            ${task.content}
                        </div>
                        <div class="task-card-priority">
                            ${task.priority}
                        </div>
                        <div class="task-card-tags">
                            <span class="task-card-tag">${task.tag}</span>
                        </div>
                    </div>
                `;
        }



        function renderTasks() {
            $(".task-list").empty();
            $.each(tasks, function (index, element) {
                $("#" + element.status + "-list").append(createTaskCard(element));
            })
        }
        renderTasks();


    </script>

</body>

</html>
